<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brooks Global Manufacturing Map</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
    }

    .map-wrapper {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: min(1000px, 96vw);
      padding: 10px;
    }

    /* Clickable location tiles */
    .zone {
      position: relative;
      aspect-ratio: 1 / 1;
      cursor: pointer;
      user-select: none;
      border-radius: 14px;
      overflow: hidden;
      transition: box-shadow 0.15s ease, filter 0.15s ease;
    }

    .zone img {
      display: block;
      width: 100%;
      height: 100%;
      -webkit-user-drag: none;
    }

    .zone:hover {
      box-shadow: 0 0 0 3px #FF6600;
      filter: brightness(0.97);
    }

    /* Worldwide panel — globe with two clickable halves (same as BRP) */
    .world {
      position: relative;
      aspect-ratio: 1 / 1;
      background: #fff;
      border: 2px solid #c9d6ea;
      border-radius: 14px;
      overflow: hidden;
    }

    .world img {
      position: absolute;
      left: 7%; bottom: 14%;
      width: 78%;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .world .zone {
      position: absolute;
      left: 0; width: 100%; height: 50%;
      aspect-ratio: auto;
      border-radius: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-end;
      padding: 0 6%;
      text-align: right;
      font-size: clamp(14px, 2.6vw, 28px);
      line-height: 1.15;
      color: #000;
      text-transform: uppercase;
    }

    .world .zone:hover { background: rgba(255, 102, 0, 0.12); box-shadow: none; filter: none; }
    #zone-7 { top: 0; height: 100%; justify-content: flex-end; padding-bottom: 4%; }

    /* Tooltip */
    #tooltip {
      position: fixed;
      pointer-events: none;
      background: #fff;
      border: 2px solid #FF6600;
      border-radius: 8px;
      padding: 10px 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
      max-width: 260px;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    #tooltip.visible { opacity: 1; }

    #tooltip .tt-title {
      font-size: 13px;
      font-weight: 700;
      color: #FF6600;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    #tooltip .tt-body {
      font-size: 12px;
      color: #333;
      line-height: 1.5;
    }

    #tooltip .tt-cta {
      margin-top: 7px;
      font-size: 11px;
      color: #888;
      font-style: italic;
    }
  </style>
</head>
<body>

<div class="map-wrapper" id="mapWrapper">

  <div class="zone" id="zone-1"
    data-title="Brooks — USA"
    data-body="Brooks USA parts"
    data-url="https://shop.specialtybolt.com/products/search/?Keyword=BROOKS_2026_USA">
    <img src="Brooks USA.png" alt="Brooks — USA" draggable="false">
  </div>

  <div class="zone" id="zone-2"
    data-title="Brooks — China"
    data-body="Brooks China parts"
    data-url="https://shop.specialtybolt.com/products/search/?Keyword=BROOKS_2026_CHN">
    <img src="Brooks China.png" alt="Brooks — China" draggable="false">
  </div>

  <div class="zone" id="zone-3"
    data-title="Brooks — South Korea"
    data-body="Brooks South Korea parts"
    data-url="https://shop.specialtybolt.com/products/search/?Keyword=BROOKS_2026_KOR">
    <img src="Brooks South Korea.png" alt="Brooks — South Korea" draggable="false">
  </div>

  <div class="zone" id="zone-4"
    data-title="Brooks — Malaysia"
    data-body="Brooks Malaysia parts"
    data-url="https://shop.specialtybolt.com/products/search/?Keyword=BROOKS_2026_MYS">
    <img src="Brooks Malaysia.png" alt="Brooks — Malaysia" draggable="false">
  </div>

  <div class="zone" id="zone-5"
    data-title="Brooks — Taiwan"
    data-body="Brooks Taiwan parts"
    data-url="https://shop.specialtybolt.com/products/search/?Keyword=BROOKS_2026_TWN">
    <img src="Brooks Taiwan.png" alt="Brooks — Taiwan" draggable="false">
  </div>

  <!-- Worldwide panel: whole panel links to all Brooks parts -->
  <div class="world">
    <img src="Brooks Globe.png" alt="Worldwide" draggable="false">
    <div class="zone" id="zone-7"
      data-title="All Brooks Parts"
      data-body="Active and Inactive Parts"
      data-url="https://shop.specialtybolt.com/products/search/?Keyword=BROOKS_2026_ALL">
      <span>All Brooks Parts</span>
    </div>
  </div>

</div>

<!-- Tooltip -->
<div id="tooltip">
  <div class="tt-title" id="tt-title"></div>
  <div class="tt-body" id="tt-body"></div>
  <div class="tt-cta">Click to browse parts →</div>
</div>

<script>
  const tooltip = document.getElementById('tooltip');
  const ttTitle = document.getElementById('tt-title');
  const ttBody  = document.getElementById('tt-body');
  const zones   = document.querySelectorAll('.zone');
  const OFFSET  = 16;

  function positionTooltip(e) {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const tw = tooltip.offsetWidth  || 260;
    const th = tooltip.offsetHeight || 80;
    let x = e.clientX + OFFSET;
    let y = e.clientY + OFFSET;
    if (x + tw > vw - 10) x = e.clientX - tw - OFFSET;
    if (y + th > vh - 10) y = e.clientY - th - OFFSET;
    tooltip.style.left = x + 'px';
    tooltip.style.top  = y + 'px';
  }

  zones.forEach(zone => {
    zone.addEventListener('mouseenter', e => {
      ttTitle.textContent = zone.dataset.title;
      ttBody.textContent  = zone.dataset.body;
      tooltip.classList.add('visible');
      positionTooltip(e);
    });

    zone.addEventListener('mousemove', positionTooltip);

    zone.addEventListener('mouseleave', () => {
      tooltip.classList.remove('visible');
    });

    zone.addEventListener('click', () => {
      window.open(zone.dataset.url, '_blank', 'noopener,noreferrer');
    });
  });
</script>

</body>
</html>
