<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fastener Identifier Tool | SBS Specialty Bolt and Screw</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#1D3557;--navy-dark:#12243a;--orange:#E87722;--orange-light:#F0913A;--orange-pale:#FDF0E5;--gray-50:#F8F9FA;--gray-100:#F0F2F5;--gray-200:#E2E6EA;--gray-300:#CED4DA;--gray-400:#ADB5BD;--gray-500:#6C757D;--gray-600:#495057;--gray-700:#343A40;--green:#1A8A4A;--green-pale:#E8F5EE;--amber:#B7610A;--amber-pale:#FEF3E2;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:'Inter',sans-serif;background:var(--gray-100);color:var(--gray-700);}
#sbs-header{position:sticky;top:0;z-index:100;background:#fff;border-bottom:3px solid var(--orange);box-shadow:0 2px 8px rgba(0,0,0,.10);padding:.65rem 1.5rem;display:flex;align-items:center;gap:1rem;min-height:68px;}
#sbs-header .logo img{height:48px;display:block;}
.hdr-div{width:1px;height:36px;background:var(--gray-200);flex-shrink:0;}
.title-block{flex:1;}
.tool-title{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;color:var(--navy);line-height:1.1;}
.tool-sub{font-size:11px;color:var(--gray-500);margin-top:2px;}
.unit-toggle{display:flex;align-items:center;gap:.4rem;}
.unit-lbl{font-family:'Barlow',sans-serif;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--gray-500);}
.unit-btn,.btn-g{font-family:'Barlow',sans-serif;font-size:11px;font-weight:700;padding:.28rem .7rem;border:1.5px solid var(--gray-300);background:#fff;color:var(--gray-600);border-radius:5px;cursor:pointer;}
.unit-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}
#stepper{background:#fff;border-bottom:1px solid var(--gray-200);display:flex;overflow-x:auto;padding:0 1rem;position:sticky;top:68px;z-index:99;}
.st{font-family:'Barlow',sans-serif;font-size:12px;font-weight:700;padding:.7rem .8rem;border:none;background:none;color:var(--gray-400);border-bottom:3px solid transparent;cursor:default;white-space:nowrap;display:flex;gap:.35rem;align-items:center;}
.st .n{width:18px;height:18px;border-radius:50%;background:var(--gray-200);color:var(--gray-500);font-size:10px;display:flex;align-items:center;justify-content:center;}
.st.done{color:var(--navy);cursor:pointer;}.st.done .n{background:var(--green);color:#fff;}
.st.cur{color:var(--navy);border-bottom-color:var(--orange);}.st.cur .n{background:var(--orange);color:#fff;}
#layout{display:grid;grid-template-columns:1fr 300px;gap:1rem;padding:1rem 1.5rem 2rem;max-width:1300px;margin:0 auto;}
.card{background:#fff;border-radius:10px;border:1px solid var(--gray-200);box-shadow:0 1px 4px rgba(0,0,0,.06);}
#wiz{padding:1.2rem 1.3rem;}
.q-num{font-family:'Barlow',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--orange);}
.q-title{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;color:var(--navy);margin:.15rem 0 .3rem;}
.q-hint{font-size:12.5px;color:var(--gray-600);line-height:1.5;margin-bottom:.9rem;}
.grp{font-family:'Barlow',sans-serif;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--gray-500);margin:.8rem 0 .4rem;}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:.6rem;}
.tile{background:#fff;border:2px solid var(--gray-200);border-radius:10px;padding:.5rem .4rem .55rem;cursor:pointer;text-align:center;position:relative;transition:all .12s;font-family:inherit;}
.tile:hover{border-color:var(--orange-light);transform:translateY(-1px);}
.tile.sel{border-color:var(--orange);background:var(--orange-pale);box-shadow:0 0 0 2px rgba(232,119,34,.25);}
.tile.sel::after{content:'\2713';position:absolute;top:4px;right:6px;background:var(--orange);color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:18px;font-weight:800;}
.tile.dim{opacity:.45;}
.tile svg,.tile img{width:100%;height:78px;display:block;object-fit:contain;}
.tl{font-family:'Barlow',sans-serif;font-size:12.5px;font-weight:700;color:var(--navy);margin-top:.25rem;line-height:1.2;}
.ts{font-size:10.5px;color:var(--gray-500);margin-top:.15rem;line-height:1.25;}
.tile.unk{border-style:dashed;}
.nav{display:flex;justify-content:space-between;gap:.6rem;margin-top:1.2rem;padding-top:.9rem;border-top:1px solid var(--gray-100);}
.btn-o,.btn-n{font-family:'Barlow',sans-serif;font-size:13px;font-weight:700;padding:.55rem 1.3rem;border:none;border-radius:7px;cursor:pointer;color:#fff;}
.btn-o{background:var(--orange);}.btn-o:hover{background:var(--orange-light);}
.btn-n{background:var(--navy);}.btn-n:hover{background:var(--navy-dark);}
.btn-o:disabled{opacity:.45;cursor:not-allowed;}
.fld{display:flex;flex-direction:column;gap:.25rem;margin-bottom:.8rem;max-width:380px;}
.fld label{font-family:'Barlow',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--gray-500);}
.fld input,.fld select{font-family:'Inter',sans-serif;font-size:15px;border:1.5px solid var(--gray-300);border-radius:6px;padding:.5rem .6rem;background:#fff;color:var(--gray-700);}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--orange);}
.row{display:flex;gap:.6rem;flex-wrap:wrap;}
.fld.off{opacity:.4;}.fld.off input,.fld.off select{background:var(--gray-100);cursor:not-allowed;}
#drawer-ov{position:fixed;inset:0;background:rgba(18,36,58,.55);z-index:190;display:none;}
#drawer-ov.open{display:block;}
#drawer{position:fixed;left:0;top:0;bottom:0;width:min(580px,94vw);background:#fff;z-index:200;box-shadow:6px 0 30px rgba(0,0,0,.3);transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;border-right:4px solid var(--orange);}
#drawer.open{transform:none;}
.dr-hd{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1rem;background:var(--navy);color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;}
.dr-hd .btn-g{background:#fff;}
.dr-body{overflow-y:auto;padding:1rem 1.1rem 1.5rem;flex:1;}
.dr-body .tiles{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))!important;}
.dr-body .tile svg,.dr-body .tile img{height:62px;}
.dr-q{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;background:#fff;border:1.5px solid var(--gray-200);border-radius:8px;padding:.6rem .8rem;margin-bottom:.45rem;cursor:pointer;font-family:inherit;}
.dr-q:hover{border-color:var(--orange);background:var(--orange-pale);}
.dr-q .n{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.dr-q .dq{flex:1;display:flex;flex-direction:column;gap:2px;}
.dr-q b{font-family:'Barlow',sans-serif;font-size:13px;color:var(--navy);}
.dr-q em{font-style:normal;font-size:12px;color:var(--orange);font-weight:600;}
.tbd{border:2px dashed var(--navy);border-radius:10px;background:#F3F6FB;padding:1rem 1.2rem;margin-top:1rem;}
.tbd-badge{display:inline-block;background:var(--orange);color:#fff;font-family:'Barlow',sans-serif;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:.2rem .65rem;border-radius:20px;}
.tbd h3{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;color:var(--navy);margin:.4rem 0 .2rem;}
.tbd-pn{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;color:var(--navy);background:#fff;border:1px solid var(--gray-200);border-radius:8px;padding:.35rem .7rem;display:inline-block;margin:.4rem 0;letter-spacing:.5px;}
.hintbox{background:var(--orange-pale);border:1px solid var(--orange);border-radius:8px;padding:.55rem .8rem;font-size:12.5px;color:var(--navy);margin:.2rem 0 .8rem;line-height:1.5;min-height:2.2rem;}
.dgm{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.6rem;margin-bottom:.9rem;}
.dg{border:2px solid var(--gray-200);border-radius:10px;padding:.4rem;text-align:center;}
.dg.hl{border-color:var(--orange);background:var(--orange-pale);}
.dg svg{width:100%;height:150px;}
#recap{padding:.9rem 1rem;align-self:start;position:sticky;top:130px;}
#recap h3{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;color:var(--navy);margin-bottom:.5rem;}
.rc-i{display:flex;justify-content:space-between;gap:.5rem;font-size:12px;padding:.3rem 0;border-bottom:1px solid var(--gray-100);cursor:pointer;}
.rc-i b{color:var(--gray-500);font-weight:600;font-family:'Barlow',sans-serif;text-transform:uppercase;font-size:10px;letter-spacing:.7px;padding-top:2px;}
.rc-i span{text-align:right;color:var(--navy);font-weight:600;}
/* RESULTS */
.res-top{border-radius:10px;padding:1rem 1.2rem;margin-bottom:.9rem;}
.res-top.ok{background:var(--green-pale);border:1.5px solid var(--green);}
.res-top.sp{background:var(--amber-pale);border:1.5px solid var(--amber);}
.res-top.none{background:#FDECEA;border:1.5px solid #C0392B;}
.res-lead{font-family:'Barlow',sans-serif;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;}
.ok .res-lead{color:var(--green);}.sp .res-lead{color:var(--amber);}
.res-desc{font-family:'Barlow Condensed',sans-serif;font-size:27px;font-weight:800;color:var(--navy);line-height:1.15;margin:.2rem 0 .5rem;}
.chips{display:flex;flex-wrap:wrap;gap:.3rem;margin:.4rem 0;}
.chip{font-family:'Barlow',sans-serif;font-size:10.5px;font-weight:700;padding:.15rem .5rem;border-radius:12px;background:var(--gray-100);color:var(--gray-600);}
.chip.g{background:var(--green-pale);color:var(--green);}.chip.a{background:var(--amber-pale);color:var(--amber);}.chip.b{background:#E8F0FF;color:var(--navy);}
ul.nt{padding-left:1.1rem;font-size:12.5px;line-height:1.55;margin:.3rem 0;}
ul.nt.w li{color:var(--amber);font-weight:600;}
.lnk{display:inline-block;font-family:'Barlow',sans-serif;font-size:12px;font-weight:700;color:#fff;background:var(--navy);padding:.35rem .8rem;border-radius:6px;text-decoration:none;margin:.2rem .3rem .2rem 0;}
.lnk:hover{background:var(--orange);}
.alt{padding:.8rem 1rem;margin-bottom:.6rem;}
.alt .res-desc{font-size:20px;margin:.1rem 0 .3rem;}
.disc{font-size:11px;color:var(--gray-500);margin-top:1rem;line-height:1.5;}
@media(max-width:860px){#layout{grid-template-columns:1fr;padding:.7rem;}#recap{position:static;}#sbs-header{flex-wrap:wrap;}.tool-sub{display:none;}}
@media print{#stepper,.nav,#sbs-header .unit-toggle,#recap{display:none!important;}}

.helper{border:1.5px solid var(--gray-200);border-radius:8px;margin:.9rem 0;background:var(--gray-50);}
.helper>summary{cursor:pointer;padding:.55rem .8rem;font-family:'Barlow',sans-serif;font-weight:700;font-size:13px;color:var(--navy);}
.helper .hp,.helper .hp1{padding:.2rem .8rem .8rem;}
.helper .hp{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.ptable{max-height:230px;overflow:auto;border:1px solid var(--gray-200);border-radius:6px;background:#fff;margin-top:.35rem;}
.ptable table,.mtab{width:100%;border-collapse:collapse;font-size:12px;}
.ptable th,.ptable td,.mtab th,.mtab td{padding:.28rem .5rem;border-bottom:1px solid var(--gray-100);text-align:left;}
.ptable th,.mtab th{background:var(--gray-50);font-family:'Barlow',sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--gray-500);position:sticky;top:0;}
.ptable tr.hl{background:var(--orange-pale);}
.pfilter{width:100%;margin-top:.3rem;font-size:13px;border:1.5px solid var(--gray-300);border-radius:6px;padding:.3rem .5rem;}
.mtab{background:#fff;border:1px solid var(--gray-200);margin-top:.6rem;}
.conf{border:1.5px solid var(--gray-200);border-radius:8px;padding:.55rem .75rem;margin-bottom:.8rem;background:#fff;}
#recap .conf{margin-bottom:.7rem;}
.conf-t{display:flex;justify-content:space-between;gap:.5rem;font-size:12px;color:var(--navy);flex-wrap:wrap;}
.conf-t span{color:var(--gray-500);}
.conf-bar{height:7px;background:var(--gray-200);border-radius:4px;overflow:hidden;margin:.35rem 0;}
.conf-bar i{display:block;height:100%;border-radius:4px;transition:width .25s;}
.conf-n{font-size:12px;color:var(--gray-600);line-height:1.5;min-height:1rem;}
.logbox{font-size:11.5px;color:var(--gray-500);margin-top:1rem;padding-top:.7rem;border-top:1px solid var(--gray-100);line-height:1.9;}
li.sl{font-size:12px;}li.sl.n{color:#B7610A;}
@media(max-width:860px){.helper .hp{grid-template-columns:1fr;}}
.tipi{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;margin-left:.3rem;border-radius:50%;background:var(--navy);color:#fff;font-size:10px;font-weight:800;position:relative;cursor:help;vertical-align:middle;}
.tipi .tipt{display:none;position:absolute;bottom:130%;left:50%;transform:translateX(-50%);width:210px;background:var(--navy-dark);color:#fff;font-size:11px;font-weight:500;line-height:1.35;padding:.45rem .6rem;border-radius:6px;text-align:left;z-index:50;box-shadow:0 4px 14px rgba(0,0,0,.3);}
.tipi:hover .tipt,.tipi:focus .tipt{display:block;}
.mdg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.6rem;margin-bottom:.9rem;}
.mdg .dg svg{height:135px;}

.title-link{color:inherit;text-decoration:none;}.title-link:hover{color:var(--orange);text-decoration:underline;}
.cta{border:2px solid var(--orange);border-radius:10px;background:var(--orange-pale);padding:.9rem 1.1rem;margin-top:1rem;}
.cta-t{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;color:var(--navy);margin-bottom:.5rem;}
.cta-b{display:flex;flex-wrap:wrap;gap:.5rem;}
.cta-n{font-size:12px;color:var(--gray-600);line-height:1.5;margin-top:.6rem;}
#report{display:none;font-family:'Inter',Arial,sans-serif;color:#222;}
#report h1{font-family:'Barlow Condensed',Arial,sans-serif;font-size:26px;color:#1D3557;margin:.2rem 0;}
#report h2{font-family:'Barlow Condensed',Arial,sans-serif;font-size:18px;color:#E87722;border-bottom:2px solid #E87722;margin:1rem 0 .4rem;padding-bottom:2px;}
#report table{width:100%;border-collapse:collapse;font-size:12px;}
#report td{padding:4px 6px;border-bottom:1px solid #ddd;vertical-align:top;}
#report td.n{width:24px;color:#6C757D;}
#report .rh{display:flex;align-items:center;gap:12px;border-bottom:3px solid #E87722;padding-bottom:8px;}
#report .rh img{height:44px;}
#report .big{font-family:'Barlow Condensed',Arial,sans-serif;font-size:22px;font-weight:800;color:#1D3557;margin:.3rem 0;}
#report .cd{border:1px solid #ccc;border-radius:6px;padding:8px 10px;margin:6px 0;page-break-inside:avoid;font-size:12px;}
#report ul{margin:.2rem 0 .2rem 1.1rem;padding:0;font-size:11.5px;}
#report .w li{color:#B7610A;}
#report .sm{font-size:10.5px;color:#666;margin-top:10px;line-height:1.5;}
@media print{body.printing #sbs-header,body.printing #stepper,body.printing #layout,body.printing #drawer,body.printing #drawer-ov{display:none!important;}
 body.printing #report{display:block!important;}body.printing{background:#fff;}@page{margin:14mm;}}
</style>
</head>

const S='stroke="#1D3557" stroke-width="1.6" stroke-linejoin="round"', F='fill="#E2E6EA"', DK='fill="#495057"';

const ptsPoly=(cx,cy,r,n,rot=0)=>Array.from({length:n},(_,i)=>{const a=2*Math.PI/n*i+rot;return (cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1)}).join(' ');
const lobe=(cx,cy,R,n=6,amp=.16)=>Array.from({length:90},(_,i)=>{const a=2*Math.PI*i/90,r=R*(1-amp+amp*Math.cos(n*a));return (cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1)}).join(' ');

 {id:'hexflange',label:'Hex Flange',sub:'hex with built-in washer',yt:16,side:`<path d="M12 34V30Q12 28 15 28H49Q52 28 52 30V34Z" ${F} ${S}/><rect x="18" y="16" width="28" height="12" ${F} ${S}/>`,top:circT(25)+`<polygon points="${ptsPoly(92,38,16,6,Math.PI/6)}" ${F} ${S}/>`},

const markShape=()=>{if(!known(ans.head))return 'circle';const sh=[...new Set(ans.head.map(h=>({hex:'hex',hexflange:'hex',square:'square',extorx:'lobe'}[h]||'circle')))];return sh.length===1?sh[0]:'circle'};
const shapeEl=()=>{const s=markShape();return s==='hex'?`<polygon points="${ptsPoly(32,32,29,6,Math.PI/6)}" ${F} ${S}/>`:s==='square'?`<rect x="5" y="5" width="54" height="54" ${F} ${S}/>`:s==='lobe'?`<polygon points="${lobe(32,32,30)}" ${F} ${S}/>`:`<circle cx="32" cy="32" r="29" ${F} ${S}/>`};
const mkIc=(txt,n=0,fs=15,extra='')=>svg(shapeEl()+(txt?`<text x="32" y="${32+fs*.36}" text-anchor="middle" font-family="Barlow,Arial" font-weight="800" font-size="${fs}" fill="#1D3557">${txt}</text>`:'')+Array.from({length:n},(_,k)=>{const a=(n===3?(k*2+0)*60:k*60)*Math.PI/180;return `<line x1="${32+14*Math.cos(a)}" y1="${32+14*Math.sin(a)}" x2="${32+26*Math.cos(a)}" y2="${32+26*Math.sin(a)}" stroke="#1D3557" stroke-width="3" stroke-linecap="round"/>`}).join('')+extra,'0 0 64 64');

function thSvg(t){
 const X0=24,X1=112;let p='';
 const zig=(per,amp,from,to,alt)=>{let s=[`${from},20`],x=from,i=0;while(x<to){const a=alt?(i%2?amp*.4:amp):amp;s.push(`${x+per/2},${20-a}`,`${x+per},20`);x+=per;i++;}return s.join(' ')};
 const base=`<rect x="4" y="12" width="22" height="16" ${F} ${S}/>`;
 const bodyRect=(x0,x1)=>`<rect x="${x0}" y="14" width="${x1-x0}" height="12" ${F} stroke="none"/>`;
 if(t==='machine')p=`<line x1="26" y1="14" x2="110" y2="14" ${S}/><line x1="26" y1="26" x2="110" y2="26" ${S}/><polyline points="${zig(4,6,26,108)}" fill="none" ${S} transform="translate(0,0)"/><line x1="110" y1="14" x2="110" y2="26" ${S}/>`;
 if(t==='sheet')p=`<polyline points="${zig(8,9,26,100)}" fill="none" ${S}/><polygon points="100,20 114,20 100,11" ${F} ${S}/>`;
 if(t==='hilo')p=`<polyline points="${zig(8,9,26,108,1)}" fill="none" ${S}/><line x1="108" y1="20" x2="112" y2="20" ${S}/>`;
 if(t==='wood')p=`<rect x="26" y="14" width="34" height="12" ${F} ${S}/><polyline points="${zig(8,8,60,100)}" fill="none" ${S}/><polygon points="100,20 116,20 100,13" ${F} ${S}/>`;
 if(t==='selfdrill')p=`<polyline points="${zig(8,9,26,86)}" fill="none" ${S}/><polygon points="86,12 104,14 116,20 104,26 86,28" ${F} ${S}/><line x1="92" y1="12" x2="102" y2="26" ${S}/>`;
 return svg(base+p,'0 0 120 40');
}

function lbl(id,arr){const o=arr.find(x=>x.id===id);return o?o.label:id}
function recapVal(id){
 if(id==='head')return known(ans.head)?ans.head.map(h=>lbl(h,HEADS)).join(', '):(ans.head.length?'Not sure':'—');
 if(id==='drive')return known(ans.drive)?ans.drive.map(h=>lbl(h,DRIVES)).join(', '):(ans.drive.length?'Not sure':'—');
 if(id==='mark'){if(!ans.mark)return'—';if(ans.mark==='unk')return'Not sure';return buildMarks().flatMap(g=>g.items).find(x=>x.id===ans.mark).label}
 if(id==='finish'){const mg=[ans.magnet!=='unk'?({yes:'magnetic',weak:'weakly magnetic',no:'non-magnetic'})[ans.magnet]:'',ans.oily==='yes'?'oily':ans.oily==='no'?'dry':''].filter(Boolean).join(', ');return known(ans.finish)?ans.finish.map(x=>lbl(x,FINISHES)).join(', ')+(mg?' / '+mg:''):(ans.finish.length?'Not sure'+(mg?' / '+mg:''):(mg||'—'))}
 if(id==='thread')return !ans.thread?'—':ans.thread==='unk'?'Not sure':lbl(ans.thread,THREADS);
 if(id==='length')return ans.length?ans.length+' '+unit:'—';
 if(id==='size'){const b=[];if(ans.gauge)b.push(ans.gauge);else if(ans.dia)b.push('Ø'+ans.dia+' '+unit);if(!ans.gauge&&ans.ptype!=='unk')b.push(ans.ptype==='coarse'?'coarse':ans.ptype==='fine'?'fine':(ans.pval||'?')+(ans.ptype==='mm'?' mm pitch':' TPI'));return b.join(', ')||'—'}
 if(id==='point')return !ans.point?'—':ans.point==='unk'?'Not sure':lbl(ans.point,POINTS);

function card(c,top,mode){

 const chipsHtml=c.ok.map(x=>`<span class="chip g">&#10003; ${x}</span>`).join('')+(c.f.std?`<span class="chip b">${c.f.std}</span>`:'<span class="chip a">No common standard</span>')+`<span class="chip">${c.f.sys==='M'?'Metric':'Inch'}</span>`;
 return `<div class="${top?'':'card alt'}">${top?'':`<div class="res-desc">${mode==='sp'?c.sh+' <span style="color:#B7610A">— BUT SPECIAL</span>':c.desc}</div>`}<div class="chips">${chipsHtml}</div>${c.f.note?`<ul class="nt"><li>${c.f.note}</li></ul>`:''}${c.n.length?`<ul class="nt">${c.n.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}${c.v.length||c.warn.length?`<ul class="nt w">${c.v.map(x=>`<li>${x.t}</li>`).join('')}${c.warn.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}${stdTokens(c.f).length?`<details style="margin-top:.35rem"><summary class="q-hint" style="cursor:pointer">Standards Library check</summary><ul class="nt">${libLines(c.f)}</ul></details>`:''}<div style="margin-top:.4rem"><span class="q-hint" style="margin-right:.3rem">Confirm the standard:</span>${links||'<span class="q-hint">Compare with the vendor drawing.</span>'}<button class="btn-g" data-act="copy" data-v="${encodeURIComponent(c.desc)}">Copy description</button></div></div>`}
function renderResults(){
 const all=evaluate();let h='';

 else if(strict.length){
  const t=strict[0];h=`<div class="res-top ok"><div class="res-lead">Part could be</div><div class="res-desc">${t.desc}</div>${card(t,true)}</div>`;
  if(strict.length>1)h+=`<div class="grp">Also consistent with your answers (${strict.length-1})</div>`+strict.slice(1,8).map(c=>card(c,false,'ok')).join('');

  const rest=all.filter(c=>c!==t&&c.w<=t.w+0).slice(0,3);
  if(rest.length)h+=`<div class="grp">Other near matches</div>`+rest.map(c=>card(c,false,'sp')).join('');
 }

document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='in-wsz'){ans.wsz=t.value;updWashHint();renderRecap();if(drawerOpen||showRes)renderResults()}
 if(t.id==='in-gauge'&&ans.kind==='nut'){const off=!!t.value;const e2=$('in-af');if(e2)e2.disabled=off;const f=$('fl-dia');if(f)f.classList.toggle('off',off);updNutHint()}});
ans.kind=null;


/* ---- PDF report, new tab, home link ---- */
const escH=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plainT=h=>String(h).replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&mdash;/g,'-').replace(/&rarr;/g,'->').replace(/&nbsp;/g,' ');
function reportCand(c,special){
 const std=c.f.std?escH(c.f.std):'No common standard';
 const lib=stdTokens(c.f).map(k=>{const i=STDINFO[k];return i&&!i.missing?`${k}: ${i.status||'in library'}${i.status==='Withdrawn'&&i.rep?' -> '+i.rep:''}`:`${k}: not found in library`}).join('; ');
 return `<div class="cd"><b>${escH(special?c.sh+' - BUT SPECIAL':c.desc)}</b><div>Standard: ${std}${c.f.sys==='M'?' (metric)':' (inch)'}</div>${lib?`<div style="color:#555">Standards Library: ${escH(lib)}</div>`:''}${c.ok.length?`<div style="color:#1A8A4A">Matched: ${c.ok.map(escH).join(' | ')}</div>`:''}${c.f.note?`<ul><li>${escH(c.f.note)}</li></ul>`:''}${c.n.length?`<ul>${c.n.map(x=>`<li>${escH(x)}</li>`).join('')}</ul>`:''}${c.v.length||c.warn.length?`<ul class="w">${c.v.map(x=>`<li>${escH(x.t)}</li>`).join('')}${c.warn.map(x=>`<li>${escH(x)}</li>`).join('')}</ul>`:''}</div>`}
function reportHTML(){
 const all=evaluate(),strict=all.filter(c=>c.w===0),ci=confInfo();
 const kind={screw:'Screw / Bolt',nut:'Nut',washer:'Washer'}[ans.kind]||'';
 const logo=document.querySelector('#sbs-header img').src;
 const qa=STEPS.map((s,i)=>{let a=plainT(recapVal(s.id));if(a==='—'||a==='')a='Not answered';return `<tr><td class="n">${i+1}</td><td>${escH(plainT(s.q))}</td><td><b>${escH(a)}</b></td></tr>`}).join('');
 let res='';
 if(!all.length)res='<div class="big">No catalog match</div><p>The part does not match a standard catalog item. Treat it as a special / custom part.</p>';
 else if(strict.length){const t=strict[0];res=`<div style="font-size:11px;font-weight:700;color:#1A8A4A">PART COULD BE</div><div class="big">${escH(t.desc)}</div>${reportCand(t,false)}`+(strict.length>1?`<h2>Also consistent with the answers (${strict.length-1})</h2>`+strict.slice(1,6).map(c=>reportCand(c,false)).join('')+(strict.length>6?`<div class="sm">... and ${strict.length-6} more.</div>`:''):'')}
 else{const t=all[0];res=`<div style="font-size:11px;font-weight:700;color:#B7610A">PART APPEARS TO BE</div><div class="big">${escH(t.sh)} - BUT SPECIAL</div><div class="sm">What does not line up with a standard catalog item:</div>${reportCand(t,true)}`+(all.slice(1,4).length?'<h2>Other near matches</h2>'+all.slice(1,4).map(c=>reportCand(c,true)).join(''):'')}
 let pn='';const tc=strict.length?strict[0]:all[0];if(tc){const x=sbsPN(tc);pn=`<h2>SBS part number (in development)</h2><div class="cd">${x?`Generated preview: <b>${escH(x.pn)}</b>${x.ok?'':' (incomplete - ? = information missing)'}. This is generated from the description using SBS numbering patterns and may not exist in P21 yet.`:'No SBS part-number pattern is defined yet for this item type.'}</div>`}
 const d=new Date().toLocaleString();
 return `<div class="rh"><img src="${logo}" alt="SBS"><div><h1>Fastener Identifier Tool - Identification Report</h1><div class="sm" style="margin:0">Specialty Bolt &amp; Screw, Inc. &middot; ${escH(d)} &middot; Part type: ${escH(kind)} &middot; Confidence: ${escH(ci.label)} (${ci.n?ci.cnt+' candidate'+(ci.cnt===1?'':'s'):'none'}, ${ci.ans_}/${ci.total} questions answered)</div></div></div>
 <h2>Questions and answers</h2><table>${qa}</table><h2>Result</h2>${res}${pn}
 <div class="sm">This report is advisory. Identification from measurements cannot prove a part's grade, material or conformance - verify dimensions against the cited standard and, for critical applications, supplier certifications. Thread pitch should be confirmed with a thread pitch gauge. Units entered in ${unit==='in'?'inches':'millimetres'}.</div>`}
function printReport(){
 $('report').innerHTML=reportHTML();const t0=document.title;document.title='Fastener-Identification-'+new Date().toISOString().slice(0,10);document.body.classList.add('printing');
 const done=()=>{document.body.classList.remove('printing');document.title=t0;window.removeEventListener('afterprint',done)};window.addEventListener('afterprint',done);
 setTimeout(()=>{try{window.print()}catch(e){done()}},60)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='home'){e.preventDefault();e.stopPropagation();if(ans.kind&&answeredCount()>0&&!confirm('Go back to the start? Your current answers will be cleared. (Use Download results as PDF first if you need them.)'))return;resetAll();window.scrollTo(0,0);return}
 if(a==='pdf'){e.stopPropagation();printReport();return}
 if(a==='newtab'){e.stopPropagation();window.open(location.href.split('#')[0],'_blank','noopener');return}
},true);

render();
</script>
</body>
</html>
